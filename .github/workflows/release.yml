name: Release desktop apps

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to release, for example v0.4.1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      PRISM_TARGET_PLATFORM: ${{ matrix.platform }}
      PRISM_TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          architecture: ${{ matrix.arch }}
          cache: npm
      - name: Match the release tag to package.json
        shell: bash
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const pkg = JSON.parse(fs.readFileSync("package.json", "utf8")); if (!/^v\d+\.\d+\.\d+(?:-[a-zA-Z0-9.-]+)?$/.test(process.env.RELEASE_TAG) || process.env.RELEASE_TAG !== `v${pkg.version}`) throw new Error("Release tag must equal the package version");'
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: node scripts/package-release.mjs
      - name: Smoke test the packaged application
        shell: bash
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          node tests/packaged-smoke.cjs "release/distribution/$VERSION/darwin-arm64/Prism-Mapper-v$VERSION-macOS-arm64/Prism Mapper.app/Contents/MacOS/Electron"
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/distribution/*.zip
            release/distribution/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: downloads
      - name: Verify and publish downloads
        shell: bash
        working-directory: downloads
        run: |
          set -euo pipefail
          for checksum in *.sha256; do sha256sum --check "$checksum"; done
          test "$(find . -maxdepth 1 -name '*.zip' | wc -l)" -eq 1
          cat *.sha256 > SHA256SUMS.txt
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > release-state.txt 2>/dev/null; then
            if [ "$(cat release-state.txt)" != true ]; then
              echo "This version is already published. Create a new version to update downloads."
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Prism Mapper $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" ./*.zip SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false
