name: Release desktop apps

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag, for example v0.4.1. It must equal v plus the version in package.json."
        required: true
        type: string
      dry_run:
        description: "Build, test and upload workflow artifacts but do not publish a release. Untick to publish a release for the existing tag."
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}-${{ inputs.dry_run && 'dry-run' || 'publish' }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            runner: windows-latest
            platform: win32
            arch: x64
          - label: macOS arm64
            runner: macos-15
            platform: darwin
            arch: arm64
          - label: macOS x64
            runner: macos-15-intel
            platform: darwin
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      PRISM_TARGET_PLATFORM: ${{ matrix.platform }}
      PRISM_TARGET_ARCH: ${{ matrix.arch }}
    steps:
      # Keep LF line endings on Windows so the format check and the packaged
      # files are identical on every platform.
      - name: Keep LF line endings
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          # A real release builds the tag. A dry run builds the branch it was
          # started from, so changes to the release process can be tested.
          ref: ${{ (github.event_name == 'workflow_dispatch' && !inputs.dry_run) && format('refs/tags/{0}', inputs.tag) || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          architecture: ${{ matrix.arch }}
          cache: npm
      - name: Match the release tag to package.json
        shell: bash
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const pkg = JSON.parse(fs.readFileSync("package.json", "utf8")); if (!/^v\d+\.\d+\.\d+(?:-[a-zA-Z0-9.-]+)?$/.test(process.env.RELEASE_TAG) || process.env.RELEASE_TAG !== `v${pkg.version}`) throw new Error("Release tag must equal the package version");'
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: node scripts/package-release.mjs
      - name: Locate the packaged application
        shell: bash
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          STAGE="release/distribution/$VERSION/$PRISM_TARGET_PLATFORM-$PRISM_TARGET_ARCH"
          if [ "$PRISM_TARGET_PLATFORM" = win32 ]; then
            echo "PACKAGED_EXE=$STAGE/Prism-Mapper-v$VERSION-Windows-x64/Prism Mapper/Prism Mapper.exe" >> "$GITHUB_ENV"
            echo "SETUP_EXE=release/distribution/Prism-Mapper-v$VERSION-Windows-x64-Setup.exe" >> "$GITHUB_ENV"
            echo "INSTALL_WORK=$RUNNER_TEMP/installer-test" >> "$GITHUB_ENV"
            echo "INSTALLED_EXE=$RUNNER_TEMP/installer-test/Prism Mapper/Prism Mapper.exe" >> "$GITHUB_ENV"
          else
            echo "PACKAGED_EXE=$STAGE/Prism-Mapper-v$VERSION-macOS-$PRISM_TARGET_ARCH/Prism Mapper.app/Contents/MacOS/Electron" >> "$GITHUB_ENV"
          fi
      # TEMPORARY, removed before the branch is finished: the job log cannot be
      # downloaded from the worker's network, so findings are published as
      # annotations, which the REST API returns.
      - name: Windows diagnostics, unit test counts (temporary)
        if: matrix.platform == 'win32'
        shell: pwsh
        timeout-minutes: 8
        continue-on-error: true
        run: |
          $lines = @()
          $lines += 'tsx --test tests/*.test.ts'
          $lines += (npx tsx --test "tests/*.test.ts" 2>&1 | Select-String -Pattern '^# (tests|pass|fail|cancelled|skipped)' | ForEach-Object { $_.Line })
          $lines += 'node --test electron/*.test.cjs'
          $lines += (node --test "electron/*.test.cjs" 2>&1 | Select-String -Pattern '^# (tests|pass|fail|cancelled|skipped)' | ForEach-Object { $_.Line })
          $lines += 'npm test as the step runs it'
          $lines += (npm test 2>&1 | Select-String -Pattern '^# (tests|pass|fail|cancelled|skipped)' | ForEach-Object { $_.Line })
          $text = ($lines -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
          Write-Host "::notice title=Unit test counts on Windows::$text"
      - name: Smoke test the packaged application
        shell: bash
        run: node tests/packaged-smoke.cjs "$PACKAGED_EXE"
      - name: Test opening projects and the window size in the packaged application
        shell: bash
        timeout-minutes: 15
        run: node tests/packaged-desktop.cjs "$PACKAGED_EXE"
      - name: Test Windows paths in the packaged application
        if: matrix.platform == 'win32'
        shell: bash
        timeout-minutes: 15
        run: node tests/packaged-windows.cjs "$PACKAGED_EXE"
      - name: Smoke test the application unpacked from the ZIP
        if: matrix.platform == 'win32'
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $folder = "Prism-Mapper-v$version-Windows-x64"
          $target = Join-Path $env:RUNNER_TEMP 'portable'
          Expand-Archive -LiteralPath "release/distribution/$folder.zip" -DestinationPath $target
          node tests/packaged-smoke.cjs (Join-Path $target "$folder/Prism Mapper/Prism Mapper.exe")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # The installer is compiled with Inno Setup 6, which GitHub's Windows
      # runners have installed; it is added when a runner image does not.
      - name: Build the Windows installer
        if: matrix.platform == 'win32'
        shell: pwsh
        timeout-minutes: 20
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress --limit-output
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          node scripts/build-windows-installer.mjs *>&1 | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'installer-build.txt')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install with the Windows installer
        if: matrix.platform == 'win32'
        shell: bash
        timeout-minutes: 15
        run: node tests/packaged-installer.cjs install "$SETUP_EXE" "$INSTALL_WORK"
      - name: Smoke test the installed application
        if: matrix.platform == 'win32'
        shell: bash
        run: node tests/packaged-smoke.cjs "$INSTALLED_EXE"
      - name: Test opening projects and the window size in the installed application
        if: matrix.platform == 'win32'
        shell: bash
        timeout-minutes: 15
        run: node tests/packaged-desktop.cjs "$INSTALLED_EXE"
      - name: Open projects through the Windows commands of the installed application
        if: matrix.platform == 'win32'
        shell: bash
        timeout-minutes: 10
        run: node tests/packaged-installer.cjs integrate "$INSTALL_WORK"
      - name: Update a running copy with a second Setup
        if: matrix.platform == 'win32'
        shell: bash
        timeout-minutes: 15
        run: node tests/packaged-installer.cjs upgrade "$SETUP_EXE" "$INSTALL_WORK"
      - name: Uninstall
        if: matrix.platform == 'win32'
        shell: bash
        timeout-minutes: 10
        run: node tests/packaged-installer.cjs uninstall "$INSTALL_WORK"
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/distribution/*.zip
            release/distribution/*-Setup.exe
            release/distribution/*.sha256
          # The macOS jobs have no installer; every job has its ZIP.
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Release files and installer build output as annotations (temporary)
        if: always() && matrix.platform == 'win32'
        shell: pwsh
        run: |
          $files = Get-ChildItem release/distribution -File | ForEach-Object { '{0,14:N0}  {1}' -f $_.Length, $_.Name }
          $sums = Get-ChildItem release/distribution -Filter *.sha256 | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }
          $text = (($files + '' + $sums) -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
          Write-Host "::notice title=Release files::$text"
          $path = Join-Path $env:RUNNER_TEMP 'installer-build.txt'
          if (Test-Path $path) {
            $text = Get-Content $path -Raw
            if ($text.Length -gt 3500) { $text = $text.Substring($text.Length - 3500) }
            $escaped = $text.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::notice title=Installer build output (end)::$escaped"
          }

  publish:
    needs: build
    # A dry run stops after the builds; only a tag push or an explicit
    # non-dry run publishes a release.
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # Desktop builds come from the jobs above. Mobile builds, added by a
      # later change, upload artifacts named mobile-* in the same way.
      - uses: actions/download-artifact@v8
        with:
          pattern: "{desktop,mobile}-*"
          merge-multiple: true
          path: downloads
      - name: Verify and publish downloads
        shell: bash
        working-directory: downloads
        run: |
          set -euo pipefail
          shopt -s nullglob
          export LC_ALL=C
          VERSION="${RELEASE_TAG#v}"
          has() { local item; for item in "${files[@]}"; do [ "$item" = "$1" ] && return 0; done; return 1; }
          # Every release file must carry a SHA-256 file made by the job that
          # built it, naming that file, and it must still match after the
          # transfer between jobs.
          files=()
          for file in *; do
            case "$file" in *.sha256|SHA256SUMS.txt) continue ;; esac
            test -f "$file.sha256" || { echo "No checksum file for $file"; exit 1; }
            test "$(awk '{print $2}' "$file.sha256")" = "$file" || { echo "$file.sha256 does not name $file"; exit 1; }
            sha256sum --check "$file.sha256"
            files+=("$file")
          done
          for checksum in *.sha256; do
            test -f "${checksum%.sha256}" || { echo "$checksum has no matching file"; exit 1; }
          done
          # The desktop downloads that every release carries.
          for required in \
            "Prism-Mapper-v$VERSION-macOS-arm64.zip" \
            "Prism-Mapper-v$VERSION-macOS-x64.zip" \
            "Prism-Mapper-v$VERSION-Windows-x64.zip" \
            "Prism-Mapper-v$VERSION-Windows-x64-Setup.exe"; do
            has "$required" || { echo "Missing $required"; exit 1; }
          done
          for file in "${files[@]}"; do cat "$file.sha256"; done | sort -k2 > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          cat SHA256SUMS.txt
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > release-state.txt 2>/dev/null; then
            if [ "$(cat release-state.txt)" != true ]; then
              echo "This version is already published. Create a new version to update downloads."
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Prism Mapper $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" "${files[@]}" SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false
