name: Release

# Builds, tests and publishes Prism Mapper for Windows, Mac, Android and
# iPhone/iPad. Pushing a tag such as v0.5.0 (it must equal v plus the version in
# package.json) builds that tag and publishes a GitHub release. Running the
# workflow by hand with "dry run" ticked does everything except publishing.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag, for example v0.4.1. It must equal v plus the version in package.json."
        required: true
        type: string
      dry_run:
        description: "Build, test and upload workflow artifacts but do not publish a release. Untick to publish a release for the existing tag."
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}-${{ inputs.dry_run && 'dry-run' || 'publish' }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            runner: windows-latest
            platform: win32
            arch: x64
          - label: macOS arm64
            runner: macos-15
            platform: darwin
            arch: arm64
          - label: macOS x64
            runner: macos-15-intel
            platform: darwin
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    environment: release-signing
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      PRISM_TARGET_PLATFORM: ${{ matrix.platform }}
      PRISM_TARGET_ARCH: ${{ matrix.arch }}
      # Publishing requires real credentials. A dry run explicitly permits
      # development signatures so contributors can still rehearse packaging.
      PRISM_REQUIRE_SIGNED_RELEASE: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
      PRISM_MAC_TEAM_ID: ${{ vars.PRISM_MAC_TEAM_ID }}
      PRISM_WINDOWS_SIGNING_ENDPOINT: ${{ vars.PRISM_WINDOWS_SIGNING_ENDPOINT }}
      PRISM_WINDOWS_SIGNING_ACCOUNT: ${{ vars.PRISM_WINDOWS_SIGNING_ACCOUNT }}
      PRISM_WINDOWS_CERTIFICATE_PROFILE: ${{ vars.PRISM_WINDOWS_CERTIFICATE_PROFILE }}
      PRISM_WINDOWS_EXPECTED_PUBLISHER: ${{ vars.PRISM_WINDOWS_EXPECTED_PUBLISHER }}
    steps:
      # Keep LF line endings on Windows so the format check and the packaged
      # files are identical on every platform.
      - name: Keep LF line endings
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          # A real release builds the tag. A dry run builds the branch it was
          # started from, so changes to the release process can be tested.
          ref: ${{ (github.event_name == 'workflow_dispatch' && !inputs.dry_run) && format('refs/tags/{0}', inputs.tag) || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          architecture: ${{ matrix.arch }}
          cache: npm
      - name: Match the release tag to package.json
        shell: bash
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const pkg = JSON.parse(fs.readFileSync("package.json", "utf8")); if (!/^v\d+\.\d+\.\d+(?:-[a-zA-Z0-9.-]+)?$/.test(process.env.RELEASE_TAG) || process.env.RELEASE_TAG !== `v${pkg.version}`) throw new Error("Release tag must equal the package version");'
      - name: Check signing configuration
        id: signing
        shell: bash
        env:
          MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          MAC_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          MAC_API_KEY: ${{ secrets.MAC_API_KEY_P8_BASE64 }}
          MAC_API_ID: ${{ secrets.MAC_API_KEY_ID }}
          MAC_API_ISSUER: ${{ secrets.MAC_API_ISSUER_ID }}
          AZURE_CLIENT: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          AVAILABLE=false
          if [ "$PRISM_TARGET_PLATFORM" = darwin ]; then
            if [ -n "$MAC_CERTIFICATE" ] && [ -n "$MAC_PASSWORD" ] && [ -n "$MAC_API_KEY" ] && [ -n "$MAC_API_ID" ] && [ -n "$MAC_API_ISSUER" ]; then AVAILABLE=true; fi
          else
            if [ -n "$AZURE_CLIENT" ] && [ -n "$AZURE_TENANT" ] && [ -n "$AZURE_SUBSCRIPTION" ] && [ -n "$PRISM_WINDOWS_SIGNING_ENDPOINT" ] && [ -n "$PRISM_WINDOWS_SIGNING_ACCOUNT" ] && [ -n "$PRISM_WINDOWS_CERTIFICATE_PROFILE" ]; then AVAILABLE=true; fi
            echo "PRISM_WINDOWS_SIGNING_ENABLED=$AVAILABLE" >> "$GITHUB_ENV"
          fi
          echo "available=$AVAILABLE" >> "$GITHUB_OUTPUT"
          if [ "$PRISM_REQUIRE_SIGNED_RELEASE" = true ] && [ "$AVAILABLE" != true ]; then
            echo "::error::Publishing requires configured signing credentials. Complete docs/signing.md or run an explicit dry run."
            exit 1
          fi
          if [ "$PRISM_REQUIRE_SIGNED_RELEASE" = true ]; then
            if [ "$PRISM_TARGET_PLATFORM" = darwin ] && [ -z "$PRISM_MAC_TEAM_ID" ]; then
              echo "::error::Publishing requires PRISM_MAC_TEAM_ID to verify the intended Apple publisher."
              exit 1
            fi
            if [ "$PRISM_TARGET_PLATFORM" = win32 ] && [ -z "$PRISM_WINDOWS_EXPECTED_PUBLISHER" ]; then
              echo "::error::Publishing requires PRISM_WINDOWS_EXPECTED_PUBLISHER to verify the intended Windows publisher."
              exit 1
            fi
          fi
      - name: Prepare temporary Mac signing credentials
        if: ${{ matrix.platform == 'darwin' && steps.signing.outputs.available == 'true' }}
        shell: bash
        env:
          MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          MAC_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          MAC_API_KEY: ${{ secrets.MAC_API_KEY_P8_BASE64 }}
          MAC_API_ID: ${{ secrets.MAC_API_KEY_ID }}
          MAC_API_ISSUER: ${{ secrets.MAC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          umask 077
          KEYCHAIN="$RUNNER_TEMP/prism-signing.keychain-db"
          CERTIFICATE="$RUNNER_TEMP/prism-signing.p12"
          API_FILE="$RUNNER_TEMP/prism-notary-api.p8"
          trap 'rm -f "$CERTIFICATE"' EXIT
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$MAC_CERTIFICATE" | base64 --decode > "$CERTIFICATE"
          security import "$CERTIFICATE" -P "$MAC_PASSWORD" -T /usr/bin/codesign -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F '"' '/Developer ID Application:/ {print $2}')"
          case "$IDENTITY" in ""|*$'\n'*) echo "::error::Expected exactly one valid Developer ID Application identity."; exit 1 ;; esac
          printf '%s' "$MAC_API_KEY" | base64 --decode > "$API_FILE"
          {
            echo "PRISM_MAC_SIGNING_KEYCHAIN=$KEYCHAIN"
            echo "PRISM_MAC_SIGNING_IDENTITY=$IDENTITY"
            echo "PRISM_MAC_NOTARY_KEY_PATH=$API_FILE"
            echo "PRISM_MAC_NOTARY_KEY_ID=$MAC_API_ID"
            echo "PRISM_MAC_NOTARY_ISSUER_ID=$MAC_API_ISSUER"
          } >> "$GITHUB_ENV"
      - name: Authenticate to Azure using the release environment
        if: ${{ matrix.platform == 'win32' && steps.signing.outputs.available == 'true' }}
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Stage the Windows application
        if: ${{ matrix.platform == 'win32' }}
        run: node scripts/package-release.mjs --stage-only
      - name: Sign, notarize and package the Mac application
        if: ${{ matrix.platform == 'darwin' }}
        run: node scripts/package-release.mjs
      - name: Locate the packaged application
        shell: bash
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          STAGE="release/distribution/$VERSION/$PRISM_TARGET_PLATFORM-$PRISM_TARGET_ARCH"
          if [ "$PRISM_TARGET_PLATFORM" = win32 ]; then
            echo "PACKAGED_APP=$GITHUB_WORKSPACE/$STAGE/Prism-Mapper-v$VERSION-Windows-x64/Prism Mapper" >> "$GITHUB_ENV"
            echo "PACKAGED_EXE=$STAGE/Prism-Mapper-v$VERSION-Windows-x64/Prism Mapper/Prism Mapper.exe" >> "$GITHUB_ENV"
            echo "SETUP_EXE=release/distribution/Prism-Mapper-v$VERSION-Windows-x64-Setup.exe" >> "$GITHUB_ENV"
            echo "INSTALL_WORK=$RUNNER_TEMP/installer-test" >> "$GITHUB_ENV"
            echo "INSTALLED_EXE=$RUNNER_TEMP/installer-test/Prism Mapper/Prism Mapper.exe" >> "$GITHUB_ENV"
          else
            echo "PACKAGED_EXE=$STAGE/Prism-Mapper-v$VERSION-macOS-$PRISM_TARGET_ARCH/Prism Mapper.app/Contents/MacOS/Electron" >> "$GITHUB_ENV"
          fi
      - name: Sign Windows executable files
        if: ${{ matrix.platform == 'win32' && steps.signing.outputs.available == 'true' }}
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.PRISM_WINDOWS_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.PRISM_WINDOWS_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.PRISM_WINDOWS_CERTIFICATE_PROFILE }}
          files-folder: ${{ env.PACKAGED_APP }}
          files-folder-filter: exe,dll,node
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-azure-cli-credential: false
      - name: Verify Windows signatures and create the final ZIP
        if: ${{ matrix.platform == 'win32' }}
        run: node scripts/package-release.mjs --finalize
      - name: Smoke test the packaged application
        shell: bash
        run: node tests/packaged-smoke.cjs "$PACKAGED_EXE"
      - name: Test opening projects and the window size in the packaged application
        shell: bash
        timeout-minutes: 15
        run: node tests/packaged-desktop.cjs "$PACKAGED_EXE"
      - name: Test local MP4 shows and recent projects in the packaged application
        shell: bash
        timeout-minutes: 10
        run: node tests/show-desktop.cjs "$PACKAGED_EXE"
      - name: Test Windows paths in the packaged application
        if: ${{ matrix.platform == 'win32' }}
        shell: bash
        timeout-minutes: 15
        run: node tests/packaged-windows.cjs "$PACKAGED_EXE"
      - name: Test the Windows source launcher
        if: ${{ matrix.platform == 'win32' }}
        shell: bash
        timeout-minutes: 5
        run: node tests/launcher-windows.cjs
      # What people download is the ZIP, so the Mac app is tested after
      # unpacking it, the way the Finder does (ditto): the signature has to
      # survive the ZIP and the app has to start.
      - name: Check and smoke test the application unpacked from the ZIP
        if: ${{ matrix.platform == 'darwin' }}
        shell: bash
        timeout-minutes: 10
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          FOLDER="Prism-Mapper-v$VERSION-macOS-$PRISM_TARGET_ARCH"
          TARGET="$RUNNER_TEMP/unzipped"
          rm -rf "$TARGET"
          mkdir -p "$TARGET"
          ditto -x -k "release/distribution/$FOLDER.zip" "$TARGET"
          APP="$TARGET/$FOLDER/Prism Mapper.app"
          test -d "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          if [ "${{ steps.signing.outputs.available }}" = true ]; then
            UNZIPPED_APP="$APP" node --input-type=module -e 'import { verifyMacApplication } from "./scripts/sign-mac.mjs"; verifyMacApplication(process.env.UNZIPPED_APP, { signed: true, notarized: true, team: process.env.PRISM_MAC_TEAM_ID });'
          fi
          node tests/packaged-smoke.cjs "$APP/Contents/MacOS/Electron"
      - name: Smoke test the application unpacked from the ZIP
        if: ${{ matrix.platform == 'win32' }}
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $folder = "Prism-Mapper-v$version-Windows-x64"
          $target = Join-Path $env:RUNNER_TEMP 'portable'
          Expand-Archive -LiteralPath "release/distribution/$folder.zip" -DestinationPath $target
          node tests/packaged-smoke.cjs (Join-Path $target "$folder/Prism Mapper/Prism Mapper.exe")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # The installer is compiled with Inno Setup 6, which GitHub's Windows
      # runners have installed; it is added when a runner image does not.
      - name: Build the Windows installer
        if: ${{ matrix.platform == 'win32' }}
        shell: pwsh
        timeout-minutes: 20
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress --limit-output
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          node scripts/build-windows-installer.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install with the Windows installer
        if: ${{ matrix.platform == 'win32' }}
        shell: bash
        timeout-minutes: 15
        run: node tests/packaged-installer.cjs install "$SETUP_EXE" "$INSTALL_WORK"
      - name: Verify the installed uninstaller signature
        if: ${{ matrix.platform == 'win32' && steps.signing.outputs.available == 'true' }}
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -LiteralPath (Split-Path $env:INSTALLED_EXE) -Filter 'unins*.exe')
          if ($files.Count -ne 1) { throw 'Expected one signed uninstaller.' }
          & ./scripts/sign-windows.ps1 -FilePath $files[0].FullName -VerifyOnly
      - name: Smoke test the installed application
        if: ${{ matrix.platform == 'win32' }}
        shell: bash
        run: node tests/packaged-smoke.cjs "$INSTALLED_EXE"
      - name: Test opening projects and the window size in the installed application
        if: ${{ matrix.platform == 'win32' }}
        shell: bash
        timeout-minutes: 15
        run: node tests/packaged-desktop.cjs "$INSTALLED_EXE"
      - name: Open projects through the Windows commands of the installed application
        if: ${{ matrix.platform == 'win32' }}
        shell: bash
        timeout-minutes: 10
        run: node tests/packaged-installer.cjs integrate "$INSTALL_WORK"
      - name: Update a running copy with a second Setup
        if: ${{ matrix.platform == 'win32' }}
        shell: bash
        timeout-minutes: 15
        run: node tests/packaged-installer.cjs upgrade "$SETUP_EXE" "$INSTALL_WORK"
      - name: Uninstall
        if: ${{ matrix.platform == 'win32' }}
        shell: bash
        timeout-minutes: 10
        run: node tests/packaged-installer.cjs uninstall "$INSTALL_WORK"
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/distribution/*.zip
            release/distribution/*-Setup.exe
            release/distribution/*.sha256
          # The macOS jobs have no installer; every job has its ZIP.
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Remove temporary Mac signing credentials
        if: ${{ always() && matrix.platform == 'darwin' }}
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/prism-signing.p12" "$RUNNER_TEMP/prism-notary-api.p8"
          if [ -f "$RUNNER_TEMP/prism-signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/prism-signing.keychain-db"
          fi

  # The Android and iOS apps. The called workflow builds them and uploads
  # mobile-* artifacts that the verify job collects with the desktop ones.
  mobile:
    name: mobile apps
    uses: ./.github/workflows/mobile.yml
    with:
      version: ${{ inputs.tag || github.ref_name }}
      ref: ${{ (github.event_name == 'workflow_dispatch' && !inputs.dry_run) && format('refs/tags/{0}', inputs.tag) || github.sha }}
      require_android_signing: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    # Only the secrets that the mobile workflow reads. All are optional; see
    # docs/building-mobile.md.
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}

  # Collects what the build jobs produced and checks it, on every run. A dry
  # run therefore proves that the downloads work and still match their
  # checksums before a tag is pushed.
  verify:
    name: verify release files
    needs: [build, mobile]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      PRISM_REQUIRE_SIGNED_RELEASE: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ (github.event_name == 'workflow_dispatch' && !inputs.dry_run) && format('refs/tags/{0}', inputs.tag) || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      # Desktop builds come from the build job and mobile builds from the
      # mobile job. Only these artifacts are release files; the store bundles
      # and the test results are other artifacts.
      - uses: actions/download-artifact@v8
        with:
          pattern: "{desktop-*,mobile-android,mobile-ios}"
          merge-multiple: true
          path: downloads
      - name: Verify the downloads against their checksums
        shell: bash
        run: |
          node scripts/verify-release-files.mjs downloads "${RELEASE_TAG#v}"
          {
            echo "### Release files"
            echo
            echo '```'
            cat downloads/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # A dry run shows the local installation instructions for the downloads
      # that are present, without requiring a hosted site.
      - name: Show the release notes
        shell: bash
        run: |
          {
            echo "### Release notes"
            echo
            node scripts/release-notes.mjs "${RELEASE_TAG#v}" downloads
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: publish release
    needs: verify
    # A dry run stops after the checks; only a tag push or an explicit non-dry
    # run publishes a release.
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      PRISM_REQUIRE_SIGNED_RELEASE: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ format('refs/tags/{0}', inputs.tag || github.ref_name) }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/download-artifact@v8
        with:
          pattern: "{desktop-*,mobile-android,mobile-ios}"
          merge-multiple: true
          path: downloads
      # The same checks again on this job's own downloads; this also writes
      # SHA256SUMS.txt, which is released with the files.
      - name: Verify the downloads against their checksums
        shell: bash
        run: node scripts/verify-release-files.mjs downloads "${RELEASE_TAG#v}"
      - name: Publish the release
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release-notes.mjs "${RELEASE_TAG#v}" downloads > release-notes.md
          # A tag with a hyphen, such as v0.6.0-beta.1, is a pre-release.
          KIND=()
          case "$RELEASE_TAG" in *-*) KIND=(--prerelease) ;; esac
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > release-state.txt 2>/dev/null; then
            if [ "$(cat release-state.txt)" != true ]; then
              echo "This version is already published. Create a new version to update downloads."
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Prism Mapper $RELEASE_TAG" --notes-file release-notes.md --generate-notes "${KIND[@]}"
          fi
          # Exactly the files that were verified: the downloads, their .sha256
          # files and SHA256SUMS.txt. verify-release-files.mjs refuses any other file.
          gh release upload "$RELEASE_TAG" downloads/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false
