name: Release desktop apps

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag, for example v0.4.1. It must equal v plus the version in package.json."
        required: true
        type: string
      dry_run:
        description: "Build, test and upload workflow artifacts but do not publish a release. Untick to publish a release for the existing tag."
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}-${{ inputs.dry_run && 'dry-run' || 'publish' }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            runner: windows-latest
            platform: win32
            arch: x64
          - label: macOS arm64
            runner: macos-15
            platform: darwin
            arch: arm64
          - label: macOS x64
            runner: macos-15-intel
            platform: darwin
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      PRISM_TARGET_PLATFORM: ${{ matrix.platform }}
      PRISM_TARGET_ARCH: ${{ matrix.arch }}
    steps:
      # Keep LF line endings on Windows so the format check and the packaged
      # files are identical on every platform.
      - name: Keep LF line endings
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          # A real release builds the tag. A dry run builds the branch it was
          # started from, so changes to the release process can be tested.
          ref: ${{ (github.event_name == 'workflow_dispatch' && !inputs.dry_run) && format('refs/tags/{0}', inputs.tag) || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          architecture: ${{ matrix.arch }}
          cache: npm
      - name: Match the release tag to package.json
        shell: bash
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const pkg = JSON.parse(fs.readFileSync("package.json", "utf8")); if (!/^v\d+\.\d+\.\d+(?:-[a-zA-Z0-9.-]+)?$/.test(process.env.RELEASE_TAG) || process.env.RELEASE_TAG !== `v${pkg.version}`) throw new Error("Release tag must equal the package version");'
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: node scripts/package-release.mjs
      - name: Locate the packaged application
        shell: bash
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          STAGE="release/distribution/$VERSION/$PRISM_TARGET_PLATFORM-$PRISM_TARGET_ARCH"
          if [ "$PRISM_TARGET_PLATFORM" = win32 ]; then
            echo "PACKAGED_EXE=$STAGE/Prism-Mapper-v$VERSION-Windows-x64/Prism Mapper/Prism Mapper.exe" >> "$GITHUB_ENV"
          else
            echo "PACKAGED_EXE=$STAGE/Prism-Mapper-v$VERSION-macOS-$PRISM_TARGET_ARCH/Prism Mapper.app/Contents/MacOS/Electron" >> "$GITHUB_ENV"
          fi
      # TEMPORARY diagnostics, removed before the branch is finished. Job logs
      # cannot be downloaded from the worker's network, so these steps publish
      # their findings as workflow annotations, which the REST API returns.
      - name: Windows diagnostics, environment (temporary)
        if: matrix.platform == 'win32'
        shell: pwsh
        timeout-minutes: 8
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          $out = Join-Path $env:RUNNER_TEMP 'diag-env.txt'
          function Log($value) { ($value | Out-String -Width 220).TrimEnd() | Add-Content -Path $out -Encoding utf8 }
          Log "--- os"
          Log (Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber)
          Log "--- screens (process may be DPI virtualised)"
          Add-Type -AssemblyName System.Windows.Forms
          foreach ($s in [System.Windows.Forms.Screen]::AllScreens) { Log ("{0} bounds={1} working={2} primary={3}" -f $s.DeviceName, $s.Bounds, $s.WorkingArea, $s.Primary) }
          Log "--- drives and paths"
          Log (Get-PSDrive -PSProvider FileSystem | Select-Object Name, Root)
          Log "workspace=$env:GITHUB_WORKSPACE temp=$env:RUNNER_TEMP nodeTmp=$(node -p 'require(\"os\").tmpdir()') hostname=$env:COMPUTERNAME user=$env:USERNAME"
          Log "--- long paths enabled?"
          Log (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled | Select-Object LongPathsEnabled)
          Log "--- services"
          Log (Get-Service LanmanServer, Audiosrv -ErrorAction SilentlyContinue | Select-Object Name, Status, StartType)
          Log "--- sound devices"
          Log (Get-CimInstance Win32_SoundDevice | Select-Object Name, Status)
          Log "--- tools"
          Log (Get-Command tar, 7z, choco, iscc -ErrorAction SilentlyContinue | Select-Object Name, Source)
          Log "--- electron.exe before stamping"
          $original = 'node_modules/electron/dist/electron.exe'
          Log (Get-AuthenticodeSignature $original | Select-Object Status, StatusMessage)
          Log ((Get-Item $original).VersionInfo | Select-Object FileDescription, ProductName, ProductVersion, FileVersion, CompanyName, OriginalFilename, LegalCopyright)
          Log "--- Prism Mapper.exe after stamping"
          Log (Get-AuthenticodeSignature $env:PACKAGED_EXE | Select-Object Status, StatusMessage)
          Log ((Get-Item $env:PACKAGED_EXE).VersionInfo | Select-Object FileDescription, ProductName, ProductVersion, FileVersion, CompanyName, OriginalFilename, LegalCopyright, InternalName)
          Log ("sizes: {0:N0} bytes original, {1:N0} bytes stamped" -f (Get-Item $original).Length, (Get-Item $env:PACKAGED_EXE).Length)
      - name: Windows diagnostics, Inno Setup (temporary)
        if: matrix.platform == 'win32'
        shell: pwsh
        timeout-minutes: 12
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          $out = Join-Path $env:RUNNER_TEMP 'diag-inno.txt'
          function Log($value) { ($value | Out-String -Width 220).TrimEnd() | Add-Content -Path $out -Encoding utf8 }
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          Log "ISCC before install: $(Test-Path $iscc)"
          Log "--- choco"
          Log (choco --version)
          Log (choco info innosetup --limit-output)
          $clock = [Diagnostics.Stopwatch]::StartNew()
          choco install innosetup --yes --no-progress --limit-output 2>&1 | ForEach-Object { Log $_ }
          Log "install exit $LASTEXITCODE after $([int]$clock.Elapsed.TotalSeconds) s; ISCC present: $(Test-Path $iscc)"
          Log ((Get-Item $iscc).VersionInfo | Select-Object ProductVersion, FileVersion)
          $work = Join-Path $env:RUNNER_TEMP 'inno-trial'
          New-Item -ItemType Directory -Force $work | Out-Null
          Set-Content (Join-Path $work 'hello.txt') 'hello'
          $icon = (Resolve-Path 'build/icon.ico').Path
          $script = @"
          [Setup]
          AppId={{6F1A7D2E-5B0C-4A8E-9F3D-2C4B7E8A9D10}
          AppName=Trial
          AppVersion=1.0
          DefaultDirName={autopf}\Trial
          PrivilegesRequired=lowest
          PrivilegesRequiredOverridesAllowed=dialog
          OutputDir=$work
          OutputBaseFilename=trial-setup
          SetupIconFile=$icon
          WizardStyle=modern
          [Files]
          Source: "$work\hello.txt"; DestDir: "{app}"
          "@
          Set-Content (Join-Path $work 'trial.iss') ($script -replace '(?m)^ {10}', '')
          Log "--- compile with the PNG-compressed icon"
          & $iscc (Join-Path $work 'trial.iss') 2>&1 | ForEach-Object { Log $_ }
          Log "ISCC exit $LASTEXITCODE"
          $setup = Join-Path $work 'trial-setup.exe'
          if (Test-Path $setup) {
            Log ("trial installer: {0:N0} bytes" -f (Get-Item $setup).Length)
            $target = Join-Path $work 'installed'
            $proc = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$target" -Wait -PassThru
            Log "silent install exit $($proc.ExitCode); folder: $(Get-ChildItem $target -Name | Out-String)"
            $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{6F1A7D2E-5B0C-4A8E-9F3D-2C4B7E8A9D10}_is1'
            Log "HKCU uninstall key present: $(Test-Path $key)"
            if (Test-Path $key) { Log (Get-ItemProperty $key | Select-Object DisplayName, DisplayVersion, UninstallString, InstallLocation) }
            Log "HKLM uninstall key present: $(Test-Path ($key -replace 'HKCU','HKLM'))"
            $uninstall = Join-Path $target 'unins000.exe'
            $proc = Start-Process -FilePath $uninstall -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
            $waited = 0
            while ((Test-Path $target) -and $waited -lt 30) { Start-Sleep -Seconds 1; $waited++ }
            Log "silent uninstall exit $($proc.ExitCode); folder gone after $waited s: $(-not (Test-Path $target)); key gone: $(-not (Test-Path $key))"
          }
      - name: Windows diagnostics, file association (temporary)
        if: matrix.platform == 'win32'
        shell: pwsh
        timeout-minutes: 4
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          $out = Join-Path $env:RUNNER_TEMP 'diag-assoc.txt'
          function Log($value) { ($value | Out-String -Width 220).TrimEnd() | Add-Content -Path $out -Encoding utf8 }
          $dir = Join-Path $env:RUNNER_TEMP 'assoc'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $marker = Join-Path $dir 'marker.txt'
          $sample = Join-Path $dir 'sample.prism.json'
          $plain = Join-Path $dir 'plain.json'
          Set-Content $sample '{}'
          Set-Content $plain '{}'
          $choice = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\FileExts\.json\UserChoice'
          Log "UserChoice for .json present: $(Test-Path $choice)"
          if (Test-Path $choice) { Log (Get-ItemProperty $choice | Select-Object ProgId) }
          Log "HKCR .json default: $((Get-ItemProperty 'Registry::HKEY_CLASSES_ROOT\.json' -ErrorAction SilentlyContinue).'(default)')"
          $command = 'cmd.exe /c echo "%1" > "' + $marker + '"'
          function Register($key, $name, $value) {
            New-Item -Path $key -Force | Out-Null
            Set-ItemProperty -Path $key -Name $name -Value $value
          }
          function Probe($label, $file, $verb) {
            Remove-Item $marker -ErrorAction SilentlyContinue
            $job = Start-Job -ScriptBlock {
              param($file, $verb)
              if ($verb) { Start-Process -FilePath $file -Verb $verb } else { Start-Process -FilePath $file }
            } -ArgumentList $file, $verb
            if (-not (Wait-Job $job -Timeout 12)) { Log "${label}: Start-Process did not return within 12 s" }
            Stop-Job $job -ErrorAction SilentlyContinue
            Remove-Job $job -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 2
            if (Test-Path $marker) { Log "${label}: handler used for $(Split-Path $file -Leaf)" } else { Log "${label}: handler NOT used for $(Split-Path $file -Leaf)" }
            Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.ProcessName -in 'OpenWith', 'notepad', 'Code', 'PickerHost' } | Stop-Process -Force -ErrorAction SilentlyContinue
          }
          Register 'HKCU:\Software\Classes\PrismTest.Project\shell\open\command' '(default)' $command
          Register 'HKCU:\Software\Classes\.prism.json' '(default)' 'PrismTest.Project'
          Log "V1 only .prism.json registered"
          Probe 'V1' $sample $null
          Register 'HKCU:\Software\Classes\.json' '(default)' 'PrismTest.Project'
          Log "V2 .json registered as well"
          Probe 'V2' $sample $null
          Probe 'V2' $plain $null
          Remove-Item 'HKCU:\Software\Classes\.json' -Recurse -Force
          Remove-Item 'HKCU:\Software\Classes\.prism.json' -Recurse -Force
          Register 'HKCU:\Software\Classes\SystemFileAssociations\.json\shell\prismtest\command' '(default)' $command
          Set-ItemProperty -Path 'HKCU:\Software\Classes\SystemFileAssociations\.json\shell\prismtest' -Name 'AppliesTo' -Value 'System.FileName:"*.prism.json"'
          Log "V3 SystemFileAssociations verb with AppliesTo, explicit verb"
          Probe 'V3' $sample 'prismtest'
          Remove-Item 'HKCU:\Software\Classes\SystemFileAssociations\.json' -Recurse -Force
          Remove-Item 'HKCU:\Software\Classes\PrismTest.Project' -Recurse -Force
      - name: Windows diagnostics, packaged application probe (temporary)
        if: matrix.platform == 'win32'
        shell: pwsh
        timeout-minutes: 12
        continue-on-error: true
        run: |
          $file = Join-Path $env:RUNNER_TEMP 'diag-probe.txt'
          node tests/windows-probe.cjs $env:PACKAGED_EXE 2>&1 | Tee-Object -FilePath $file
      - name: Windows diagnostics, probe with long paths switched off (temporary)
        if: matrix.platform == 'win32'
        shell: pwsh
        timeout-minutes: 8
        continue-on-error: true
        run: |
          $key = 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem'
          Set-ItemProperty -Path $key -Name LongPathsEnabled -Value 0
          $file = Join-Path $env:RUNNER_TEMP 'diag-probe-long.txt'
          "LongPathsEnabled is now $((Get-ItemProperty $key).LongPathsEnabled)" | Set-Content $file
          node tests/windows-probe.cjs $env:PACKAGED_EXE media 2>&1 | Tee-Object -FilePath $file -Append
          Set-ItemProperty -Path $key -Name LongPathsEnabled -Value 1
      - name: Smoke test the packaged application
        shell: bash
        run: node tests/packaged-smoke.cjs "$PACKAGED_EXE"
      - name: Smoke test the application unpacked from the ZIP
        if: matrix.platform == 'win32'
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $folder = "Prism-Mapper-v$version-Windows-x64"
          $target = Join-Path $env:RUNNER_TEMP 'portable'
          Expand-Archive -LiteralPath "release/distribution/$folder.zip" -DestinationPath $target
          node tests/packaged-smoke.cjs (Join-Path $target "$folder/Prism Mapper/Prism Mapper.exe")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows diagnostics, package contents (temporary)
        if: matrix.platform == 'win32'
        shell: pwsh
        continue-on-error: true
        run: |
          $version = node -p "require('./package.json').version"
          node tests/windows-inspect.mjs "release/distribution/Prism-Mapper-v$version-Windows-x64.zip" 2>&1 | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'diag-package.txt')
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/distribution/*.zip
            release/distribution/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Publish diagnostics as annotations, 1 (temporary)
        if: always() && matrix.platform == 'win32'
        shell: pwsh
        run: |
          foreach ($name in 'diag-env', 'diag-inno', 'diag-assoc') {
            $path = Join-Path $env:RUNNER_TEMP "$name.txt"
            if (-not (Test-Path $path)) { continue }
            $text = Get-Content $path -Raw
            $size = 3800
            $parts = [Math]::Ceiling($text.Length / $size)
            for ($i = 0; $i -lt $parts; $i++) {
              $chunk = $text.Substring($i * $size, [Math]::Min($size, $text.Length - $i * $size))
              $escaped = $chunk.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Host "::notice title=$name part $($i + 1) of $parts::$escaped"
            }
          }
      - name: Publish diagnostics as annotations, 2 (temporary)
        if: always() && matrix.platform == 'win32'
        shell: pwsh
        run: |
          foreach ($name in 'diag-probe', 'diag-probe-long', 'diag-package') {
            $path = Join-Path $env:RUNNER_TEMP "$name.txt"
            if (-not (Test-Path $path)) { continue }
            $text = Get-Content $path -Raw
            $size = 3800
            $parts = [Math]::Ceiling($text.Length / $size)
            for ($i = 0; $i -lt $parts; $i++) {
              $chunk = $text.Substring($i * $size, [Math]::Min($size, $text.Length - $i * $size))
              $escaped = $chunk.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Host "::warning title=$name part $($i + 1) of $parts::$escaped"
            }
          }

  publish:
    needs: build
    # A dry run stops after the builds; only a tag push or an explicit
    # non-dry run publishes a release.
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # Desktop builds come from the jobs above. Mobile builds, added by a
      # later change, upload artifacts named mobile-* in the same way.
      - uses: actions/download-artifact@v8
        with:
          pattern: "{desktop,mobile}-*"
          merge-multiple: true
          path: downloads
      - name: Verify and publish downloads
        shell: bash
        working-directory: downloads
        run: |
          set -euo pipefail
          shopt -s nullglob
          export LC_ALL=C
          VERSION="${RELEASE_TAG#v}"
          has() { local item; for item in "${files[@]}"; do [ "$item" = "$1" ] && return 0; done; return 1; }
          # Every release file must carry a SHA-256 file made by the job that
          # built it, naming that file, and it must still match after the
          # transfer between jobs.
          files=()
          for file in *; do
            case "$file" in *.sha256|SHA256SUMS.txt) continue ;; esac
            test -f "$file.sha256" || { echo "No checksum file for $file"; exit 1; }
            test "$(awk '{print $2}' "$file.sha256")" = "$file" || { echo "$file.sha256 does not name $file"; exit 1; }
            sha256sum --check "$file.sha256"
            files+=("$file")
          done
          for checksum in *.sha256; do
            test -f "${checksum%.sha256}" || { echo "$checksum has no matching file"; exit 1; }
          done
          # The desktop downloads that every release carries.
          for required in \
            "Prism-Mapper-v$VERSION-macOS-arm64.zip" \
            "Prism-Mapper-v$VERSION-macOS-x64.zip" \
            "Prism-Mapper-v$VERSION-Windows-x64.zip" \
            "Prism-Mapper-v$VERSION-Windows-x64-Setup.exe"; do
            has "$required" || { echo "Missing $required"; exit 1; }
          done
          for file in "${files[@]}"; do cat "$file.sha256"; done | sort -k2 > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          cat SHA256SUMS.txt
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > release-state.txt 2>/dev/null; then
            if [ "$(cat release-state.txt)" != true ]; then
              echo "This version is already published. Create a new version to update downloads."
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Prism Mapper $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" "${files[@]}" SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false
